<style>

px;border:1px solid #ffffff0c}.stats{display:flex;gap:8px;flex-wrap:wrap;color:#aabbd5;font-size:12px}.stats b{color:#fff}.bar{height:8px;background:#25334c;border-radius:20px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,#39b7ff,#70edbd);border-radius:20px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tab{padding:8px 12px;border-radius:10px;background:#0c1425;border:1px solid #283a59;color:#9fb1cd}.tab.active{background:#263a5c;color:#fff;border-color:#6480ad}.modecard{position:relative;overflow:hidden;min-height:185px}.modecard .big{font-size:36px}.modecard p{color:#9eafca}.modecard:after{content:"";position:absolute;right:-30px;bottom:-55px;width:160px;height:160px;border-radius:50%;border:20px solid #ffffff07}.badge{font-size:10px;padding:4px 7px;border-radius:7px;background:#283b5a;color:#c7d8f2;font-weight:900}.split{display:flex;justify-content:space-between;gap:14px;align-items:center}.progress{height:10px;border-radius:20px;background:#263650;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,#ff8d43,#ffd76b)}.character-select{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.char-choice{padding:10px;border-radius:12px;border:1px solid #2a3b5a;background:#101a2d;text-align:center}.char-choice.selected{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}.char-choice .char-icon{height:62px;font-size:38px}.char-choice h4{margin:5px 0;font-size:13px}.arena-wrap{position:relative;border:1px solid #3b5279;border-radius:15px;overflow:hidden;background:#07111c}.arena-wrap canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;touch-action:none}.hud{position:absolute;inset:10px 10px auto;display:flex;justify-content:space-between;pointer-events:none;gap:8px}.hudbox{background:#08101ddd;border:1px solid #344c70;border-radius:10px;padding:8px 10px;font-size:12px;min-width:120px}.hudbox b{display:block}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}.log{max-height:110px;overflow:auto;color:#a9bbd7;font-size:12px}.log div{padding:3px 0;border-bottom:1px solid #ffffff09}.notice{padding:11px 13px;border:1px solid #6b5128;background:#2a2117;color:#f5d8a0;border-radius:12px;font-size:12px}.rarity{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:1px}.common{color:#9aacc7}.rare{color:#52c4ff}.epic{color:#c18cff}.legendary{color:#ffb54d}.mythic{color:#ff6d8f}.modal{position:fixed;inset:0;background:#02040bd9;z-index:10;display:grid;place-items:center;padding:16px}.modalbox{max-width:650px;width:100%;background:#101a2e;border:1px solid #4a6389;border-radius:20px;padding:22px;box-shadow:0 30px 100px #0009}.modalbox h2{margin-top:0}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#f5c76a;color:#201529;padding:12px 18px;border-radius:12px;font-weight:900;z-index:20;box-shadow:0 10px 40px #0008}.footer{color:#687d9e;text-align:center;font-size:11px;padding:12px}.minirow{display:flex;gap:8px;align-items:center}.minirow .char-icon{width:55px;height:55px;flex:none;margin:0;font-size:32px}.shopitem{display:flex;gap:12px;align-items:center}.shopitem .char-icon{width:60px;height:60px;flex:none;margin:0;font-size:35px}.shopitem .grow{flex:1}.housebar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.house{border:1px solid #314563;border-radius:12px;padding:12px;text-align:center;background:#101a2d}.house .emblem{font-size:28px}.empty{padding:25px;text-align:center;color:var(--muted)}@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{position:static;display:flex;overflow:auto;gap:4px}.nav{width:auto;white-space:nowrap;margin:0}.sidebottom{display:none}.hero{grid-template-columns:1fr .6fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.character-select{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:560px){.app{padding:8px}.panel{padding:12px}.hero{grid-template-columns:1fr}.hero-art{display:none}.grid,.grid.two{grid-template-columns:1fr}.character-select{grid-template-columns:repeat(2,minmax(0,1fr))}.brand h1{font-size:16px}.wallet{width:100%}.currency{flex:1;text-align:center}.sidebar{border-radius:12px}.nav{padding:8px}.nav .ico{width:auto}.hudbox{min-width:0;font-size:10px;padding:5px 7px}.hud{inset:5px 5px auto}.controls button{flex:1}.sectionhead{align-items:flex-start}}
</style></head>
<body><div class="app">
<header class="top"><div class="brand"><div class="logo">⚔️</div><div><h1>WAR OF ELEMENT</h1><small>LES ÉLÉMENTS S'AFFRONTENT</small></div></div><div class="wallet"><div class="currency">🪙 <span id="gold">250</span></div><div class="currency">✨ <span id="essence">0</span></div><div class="currency">🎟️ <span id="tokens">0</span></div><div class="currency">🏆 <span id="trophies">0</span></div></div></header>
<div class="layout"><aside class="sidebar">
<button class="nav active" data-page="home"><span class="ico">⌂</span>Accueil</button><button class="nav" data-page="battle"><span class="ico">⚔</span>Jouer</button><button class="nav" data-page="fighters"><span class="ico">🧙</span>Personnages</button><button class="nav" data-page="spirits"><span class="ico">👻</span>Esprits</button><button class="nav" data-page="shop"><span class="ico">🛒</span>Boutique</button><button class="nav" data-page="chests"><span class="ico">🎁</span>Coffres</button><button class="nav" data-page="pass"><span class="ico">🌟</span>Pass de combat</button><button class="nav" data-page="house"><span class="ico">🏠</span>Maisons & saison</button><button class="nav" data-page="missions"><span class="ico">📜</span>Missions</button>
<div class="sidebottom">Prototype jouable hors ligne<br>Progression sauvegardée sur cet appareil.</div></aside>
<main class="main" id="main"></main></div>
<div class="footer">WAR OF ELEMENT • prototype fan-made en cours de développement • données conservées localement dans ce navigateur</div></div>
<div id="modal" class="modal hidden"><div class="modalbox" id="modalbox"></div></div><div id="toast" class="toast hidden"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const elements={Feu:{color:'#ff6446',emoji:'🔥',class:'fire'},Eau:{color:'#39aaff',emoji:'💧',class:'water'},Terre:{color:'#74d78b',emoji:'🌿',class:'earth'}};
const chars=[
{name:'Freddy',element:'Feu',emoji:'🦉',hp:3200,dmg:300,rarity:'Rare',attack:'Flamme perçante'},
{name:'Goat',element:'Feu',emoji:'🐐',hp:4500,dmg:1050,rarity:'Épique',attack:'Coup de marteau'},
{name:'Cinder',element:'Feu',emoji:'🔥',hp:3200,dmg:300,rarity:'Rare',attack:'Frappe calcinante'},
{name:'Soflar',element:'Feu',emoji:'🦊',hp:2500,dmg:260,rarity:'Rare',attack:'Mini-soleils'},
{name:'Bolly',element:'Feu',emoji:'🦎',hp:2800,dmg:280,rarity:'Rare',attack:'Morsure ardente'},
{name:'Boggie',element:'Eau',emoji:'🐟',hp:3200,dmg:600,rarity:'Épique',attack:'Lanterne aquatique'},
{name:'Rack',element:'Eau',emoji:'🦈',hp:5000,dmg:800,rarity:'Épique',attack:'Mâchoire mécanique'},
{name:'Medusa',element:'Eau',emoji:'🪼',hp:3400,dmg:400,rarity:'Épique',attack:'Onde abyssale'},
{name:'King',element:'Eau',emoji:'🐳',hp:5200,dmg:750,rarity:'Épique',attack:'Marteau royal'},
{name:'Snowboy',element:'Eau',emoji:'🦭',hp:4500,dmg:700,rarity:'Épique',attack:'Lame de givre'},
{name:'Kong',element:'Terre',emoji:'🗿',hp:3500,dmg:250,rarity:'Rare',attack:'Poing tellurique'},
{name:'Belatrice',element:'Terre',emoji:'🐝',hp:3600,dmg:600,rarity:'Épique',attack:"Aiguillon d'ambre"},
{name:'Lezy',element:'Terre',emoji:'🦎',hp:2800,dmg:320,rarity:'Rare',attack:'Griffe fossile'},
{name:'Marco',element:'Terre',emoji:'🐘',hp:3500,dmg:250,rarity:'Rare',attack:'Charge de pierre'}
];
const spirits=[
{name:'Phénix',element:'Feu',rarity:'Légendaire',desc:'Juste avant de mourir, récupère 50% de PV pendant 3 secondes.',effect:'phoenix'},
{name:'Kitsune',element:'Feu',rarity:'Épique',desc:'Un clone trompe les ennemis pendant 3 secondes ; le vrai héros devient invisible.',effect:'clone'},
{name:'Dragon',element:'Feu',rarity:'Légendaire',desc:'Vitesse +50% pendant 6 secondes.',effect:'speed'},
{name:'Guerrier',element:'Feu',rarity:'Rare',desc:'Dégâts +50% pendant 8 secondes, mais perd 30% de ses PV.',effect:'rage'},
{name:'Golem',element:'Feu',rarity:'Épique',desc:'Réduit les dégâts reçus de 25% et inflige 500 dégâts de zone.',effect:'blast'},
{name:'Dracar',element:'Feu',rarity:'Rare',desc:'Une vague de chaleur enlève 25% des PV des ennemis dans un rayon de 4 blocs.',effect:'heat'},
{name:'Triton',element:'Eau',rarity:'Rare',desc:'Ralentit les ennemis proches de 40% pendant 5 secondes (rayon 4 blocs).',effect:'slow'},
{name:'Sboui',element:'Eau',rarity:'Rare',desc:'Augmente les PV de 50% pendant 15 secondes.',effect:'health'},
{name:'Séraphin',element:'Eau',rarity:'Épique',desc:'Rétablit 20% des PV d’un allié pendant 5 secondes.',effect:'heal'},
{name:'Dragon des mers',element:'Eau',rarity:'Légendaire',desc:'Repousse les ennemis et enlève 15% de leurs PV dans un rayon de 5 blocs.',effect:'wave'},
{name:'Tortue céleste',element:'Eau',rarity:'Épique',desc:'Réduit les dégâts reçus de 30% et augmente la vitesse de 15%.',effect:'shell'},
{name:'Kraken',element:'Eau',rarity:'Mythique',desc:'Des tentacules frappent plusieurs ennemis pendant 12 secondes, 200 dégâts dans un rayon de 3 blocs.',effect:'kraken'},
{name:'Aqua Leviathan',element:'Eau',rarity:'Mythique',desc:'Vitesse et dégâts de l’équipe +25% pendant 10 secondes.',effect:'team'},
{name:'Carapace',element:'Terre',rarity:'Rare',desc:'Bouclier qui absorbe 70% des dégâts pendant 5 secondes.',effect:'shield'},
{name:'Minotaure',element:'Terre',rarity:'Épique',desc:'Dégâts +35% quand les PV passent sous 40%.',effect:'minotaur'},
{name:'Golem de pierre',element:'Terre',rarity:'Légendaire',desc:'Réduit les dégâts reçus de 40% et renvoie 15% des dégâts.',effect:'stone'},
{name:'Sable',element:'Terre',rarity:'Rare',desc:'Zone de sable mouvant de 4 blocs de rayon : vitesse ennemie réduite de 50%.',effect:'sand'},
{name:'Arbre ancien',element:'Terre',rarity:'Épique',desc:'Immobilise les ennemis dans un rayon de 5 blocs pendant 3 secondes.',effect:'root'},
{name:'Ruine',element:'Terre',rarity:'Épique',desc:'Crée quatre murs en carré qui résistent 7 secondes aux attaques.',effect:'walls'}
];
const defaultState={house:null,selected:'Freddy',levels:{},unlocked:['Freddy','Boggie','Kong'],gold:250,essence:0,tokens:0,elementTokens:{Feu:0,Eau:0,Terre:0},trophies:0,xp:0,passLevel:1,housePoints:{Feu:0,Eau:0,Terre:0},ownedSpirits:[],equipped:[],games:0,wins:0,streak:0,duoStars:0,missionDone:[],chestCount:0,chosenMode:'core'};
let S;try{S={...defaultState,...JSON.parse(localStorage.getItem('woe-save')||'{}')};S.levels=S.levels||{};S.unlocked=S.unlocked||['Freddy','Boggie','Kong'];S.ownedSpirits=S.ownedSpirits||[];S.equipped=S.equipped||[];S.housePoints=S.housePoints||{Feu:0,Eau:0,Terre:0};S.elementTokens=S.elementTokens||{Feu:0,Eau:0,Terre:0};S.missionDone=S.missionDone||[]}catch(e){S={...defaultState}}
let page='home', battle=null, gameLoop=null, lastToast;
function save(){localStorage.setItem('woe-save',JSON.stringify(S));updateWallet()}
function updateWallet(){['gold','essence','tokens','trophies'].forEach(k=>{let el=$('#'+k);if(el)el.textContent=S[k].toLocaleString('fr-FR')});}
function toast(t){let el=$('#toast');el.textContent=t;el.classList.remove('hidden');clearTimeout(lastToast);lastToast=setTimeout(()=>el.classList.add('hidden'),2400)}
function level(c){return S.levels[c]||1}
function stats(c){let l=level(c),x=chars.find(z=>z.name===c)||chars[0];let special={ 'Gardien du temple':[[6200,6600,7000,7400,7800],[700,755,810,865,920]],'Bélier braise':[[4500,4850,5200,5550,5900],[1050,1130,1210,1290,1370]],'Oroque royale':[[5200,5550,5900,6250,6600],[750,810,870,930,990]],'Lézard fossile':[[2800,3200,3700,4300,5000],[320,370,430,500,580]],'Éléphant tellurique':[[3500,4100,4800,5600,6500],[250,290,340,400,470]],'Hibou flamme':[[2800,3400,4200,5100,6300],[280,340,420,520,640]],'Renard solaire':[[2500,3100,3900,4800,5900],[260,320,400,490,610]],'Blaireau calciné':[[3200,3900,4800,5800,7000],[300,370,460,560,700]],'Abeille ambre':[[3600,4200,4800,5400],[600,700,800,900]]};let arr=special[c];return {hp:arr?arr[0][l-1]:Math.round(x.hp*(1+(l-1)*.17)),dmg:arr?arr[1][l-1]:Math.round(x.dmg*(1+(l-1)*.16)),level:l}}
function icon(c){return (chars.find(x=>x.name===c)||{emoji:'⚔️'}).emoji}
function cardChar(c){let x=chars.find(z=>z.name===c);let st=stats(c);return `<div class="card"><div class="char-icon">${x.emoji}</div><div class="element ${elements[x.element].class}">${elements[x.element].emoji} ${x.element} • ${x.rarity}</div><h3>${x.name}</h3><div class="stats"><span>❤️ <b>${st.hp.toLocaleString('fr-FR')}</b></span><span>⚔️ <b>${st.dmg.toLocaleString('fr-FR')}</b></span><span>Niv. <b>${st.level}/5</b></span></div><div class="bar"><i style="width:${st.level*20}%"></i></div><p class="muted" style="font-size:12px">${x.attack}</p><button class="small ${S.selected===c?'active':''}" onclick="selectChar('${c}')">${S.selected===c?'Sélectionné':'Sélectionner'}</button> <button class="small" onclick="upgrade('${c}')">Améliorer</button></div>`}
function go(p){page=p;$$('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
$$('.nav').forEach(b=>b.onclick=()=>go(b.dataset.page));
function render(){if(page==='home')renderHome();if(page==='battle')renderBattle();if(page==='fighters')renderFighters();if(page==='spirits')renderSpirits();if(page==='shop')renderShop();if(page==='chests')renderChests();if(page==='pass')renderPass();if(page==='house')renderHouse();if(page==='missions')renderMissions();updateWallet()}
function renderHome(){let c=chars.find(z=>z.name===S.selected)||chars[0],st=stats(c.name);$('#main').innerHTML=`<section class="panel hero"><div><div class="eyebrow">Saison 01 • Combat élémentaire</div><h2>La bataille des<br><span style="color:${elements[c.element].color}">quatre forces.</span></h2><p>Choisis ta maison, fais progresser tes combattants et mène ton équipe à la victoire. Défends ton capitaine ou vole le noyau adverse.</p><button class="primary" onclick="go('battle')">⚔ Lancer une partie</button> <button onclick="go('fighters')">Voir les combattants</button></div><div class="hero-art"><div class="orb"><span>⚔️</span></div></div></section>
<section class="panel"><div class="sectionhead"><h2>Ton combattant</h2><span class="badge">${S.house?S.house.toUpperCase()+' HOUSE':'MAISON À CHOISIR'}</span></div><div class="split"><div class="minirow"><div class="char-icon">${c.emoji}</div><div><h3 style="margin:0">${c.name}</h3><div class="muted">${c.attack} • Niveau ${st.level}</div><div class="stats"><span>❤️ ${st.hp.toLocaleString('fr-FR')} PV</span><span>⚔️ ${st.dmg} dégâts</span></div></div></div><button onclick="go('fighters')">Gérer</button></div></section>
<section class="panel"><div class="sectionhead"><h2>Modes de jeu</h2><span class="muted">Jouable maintenant</span></div><div class="grid two"><div class="card modecard"><div class="big">🛡️</div><h3>Protège ton capitaine</h3><p>3 combattants et un capitaine par maison. Si votre capitaine tombe, toute l'équipe perd.</p><button onclick="startBattle('captain')">Jouer au mode</button></div><div class="card modecard"><div class="big">💠</div><h3>Vole le noyau</h3><p>Une partie rapide de 1 min 15. Protège ton noyau et tente de voler celui d'une autre équipe.</p><button class="primary" onclick="startBattle('core')">Jouer au mode</button></div><div class="card modecard"><div class="big">🧭</div><h3>Survivant duo</h3><p>6 équipes de 2 joueurs. Duo possible avec un ami d'une autre maison. Dans cette version, les adversaires sont simulés.</p><button onclick="startBattle('duo')">Jouer au mode</button></div></div></section>
<section class="panel"><div class="sectionhead"><h2>Progression de saison</h2><button class="small" onclick="go('pass')">Voir le pass →</button></div><div class="split"><span>Pass de combat — niveau ${S.passLevel}/50</span><b>${S.xp} / 1800 XP</b></div><div class="progress" style="margin:9px 0 15px"><span style="width:${S.xp/18}%"></span></div><div class="housebar">${['Feu','Eau','Terre'].map(h=>`<div class="house"><div class="emblem">${elements[h].emoji}</div><b>${h}</b><div class="muted">${S.housePoints[h]} pts maison</div></div>`).join('')}</div></section>`}
function renderFighters(){let filt=window.filt||'Tous';$('#main').innerHTML=`<section class="panel"><div class="sectionhead"><div><div class="eyebrow">Collection</div><h2>Personnages</h2></div><span class="badge">${S.unlocked.length}/${chars.length} débloqués</span></div><div class="tabs">${['Tous','Feu','Eau','Terre'].map(e=>`<button class="tab ${filt===e?'active':''}" onclick="window.filt='${e}';renderFighters()">${e==='Tous'?'Tous les éléments':elements[e].emoji+' '+e}</button>`).join('')}</div><div class="character-select">${chars.filter(c=>(filt==='Tous'||c.element===filt)).map(c=>`<div class="char-choice ${S.selected===c.name?'selected':''}" onclick="selectChar('${c.name}')"><div class="char-icon">${c.emoji}</div><h4>${c.name}</h4><div class="element ${elements[c.element].class}">${c.element}</div><div class="muted" style="font-size:11px;margin:5px 0">${S.unlocked.includes(c.name)?'Niveau '+level(c.name):'🔒 Verrouillé'}</div>${S.unlocked.includes(c.name)?`<button class="small" onclick="event.stopPropagation();upgrade('${c.name}')">Améliorer</button>`:`<button class="small" onclick="event.stopPropagation();unlockChar('${c.name}')">Débloquer 500 🪙</button>`}</div>`).join('')}</div></section>
<section class="panel"><h3>Améliorations</h3><p class="muted">Chaque amélioration augmente les PV et les dégâts. Coût en jetons : niveau 1 → 2 : 1, 2 → 3 : 3, 3 → 4 : 5, 4 → 5 : 10, plus des pièces d'or.</p><div class="notice">Les fiches du document donnent des statistiques détaillées pour plusieurs combattants. Pour ceux sans valeurs lisibles, ce prototype utilise une base de statistiques provisoire.</div></section>`}
function selectChar(c){if(!S.unlocked.includes(c)){toast('Ce personnage est verrouillé.');return}S.selected=c;save();render()}
function upgrade(c){if(!S.unlocked.includes(c)){toast('Débloque d’abord ce personnage.');return}let l=level(c);if(l>=5){toast('Niveau maximum atteint !');return}let cost=[0,1,3,5,10][l];let gold=[0,150,350,700,1200][l];if(S.tokens<cost||S.gold<gold){toast(`Il faut ${cost} jeton(s) et ${gold} pièces d’or.`);return}S.tokens-=cost;S.gold-=gold;S.levels[c]=l+1;save();render();toast(c+' passe au niveau '+(l+1)+' !')}
function unlockChar(c){if(S.gold<500){toast('Il faut 500 pièces d’or.');return}S.gold-=500;S.unlocked.push(c);S.selected=c;save();render();toast(c+' rejoint ta collection !')}
function renderBattle(){if(!battle){$('#main').innerHTML=`<section class="panel"><div class="eyebrow">Champ de bataille</div><h2>Choisis ton mode</h2><div class="grid two"><div class="card modecard"><div class="big">🛡️</div><h3>Protège ton capitaine</h3><p>3 équipes, 3 combattants + 1 capitaine par équipe. Le dernier capitaine en vie gagne.</p><button onclick="startBattle('captain')">Lancer la partie</button></div><div class="card modecard"><div class="big">💠</div><h3>Vole le noyau</h3><p>Carte 73 × 53, trois bases (bleue, verte et rouge), 75 secondes. Vole un noyau et protège le tien.</p><button class="primary" onclick="startBattle('core')">Lancer la partie</button></div><div class="card modecard"><div class="big">🧭</div><h3>Survivant duo</h3><p>6 équipes de 2, jusqu'à 10 joueurs selon la description. Les joueurs simulés remplacent le multijoueur en ligne.</p><button onclick="startBattle('duo')">Lancer la partie</button></div></div></section><section class="panel"><h3>Commandes</h3><p>Déplacement : <b>WASD</b> ou flèches • Attaque : <b>Espace</b> ou clic • Esprit : <b>Q</b> • Esquive : <b>Shift</b>.</p><p class="muted">Les matchs sont simulés localement dans ce prototype. Pas de matchmaking ni de serveur multijoueur.</p></section>`;return}
$('#main').innerHTML=`<section class="panel"><div class="sectionhead"><div><div class="eyebrow">Partie en cours</div><h2>${battle.mode==='captain'?'Protège ton capitaine':battle.mode==='core'?'Vole le noyau':'Survivant duo'}</h2></div><span class="badge" id="timer">01:15</span></div><div class="arena-wrap"><canvas id="arena" width="960" height="540"></canvas><div class="hud"><div class="hudbox"><b id="hudname">${S.selected}</b><span id="hudhp">PV —</span><div class="bar"><i id="hudbar" style="width:100%"></i></div></div><div class="hudbox" style="text-align:right"><b id="hudobjective">Objectif</b><span id="hudinfo">Trouve les adversaires</span></div></div></div><div class="controls"><button onclick="togglePause()" id="pausebtn">Ⅱ Pause</button><button onclick="useSpirit()">Q • Activer l'esprit</button><button onclick="endBattle(false)">Abandonner</button><span class="muted">WASD/flèches · Espace/clic attaque · Q esprit</span></div><div class="log" id="battlelog"></div></section>`;initArena()}
let keys={},raf=0;
function startBattle(mode){if(!S.house){showModal(`<div class="eyebrow">Avant le combat</div><h2>Choisis ta maison</h2><p>Ta maison détermine tes couleurs et les points que tu peux rapporter à ta faction.</p><div class="grid">${['Feu','Eau','Terre'].map(h=>`<button onclick="chooseHouse('${h}');closeModal();startBattle('${mode}')">${elements[h].emoji} ${h}</button>`).join('')}</div>`);return}battle={mode,time:mode==='core'?75:mode==='captain'?120:180,paused:false,over:false,player:{x:480,y:270,hp:stats(S.selected).hp,max:stats(S.selected).hp,speed:190,team:S.house,alive:true},enemies:[],cores:{Feu:true,Eau:true,Terre:true},carried:null,log:[],kills:0};let teams=['Feu','Eau','Terre'].filter(h=>h!==S.house);for(let i=0;i<(mode==='duo'?9:6);i++){let team=teams[i%teams.length]||'Feu';battle.enemies.push({x:100+Math.random()*760,y:70+Math.random()*400,hp:2200+Math.random()*1800,max:3000,team,alive:true,cd:Math.random()});}go('battle')}
function initArena(){let cv=$('#arena');if(!cv)return;let ctx=cv.getContext('2d');let last=performance.now();keys={};let player=battle.player;let draw=now=>{if(!battle||battle.over||!$('#arena'))return;let dt=Math.min(.04,(now-last)/1000);last=now;if(!battle.paused){battle.time-=dt;if(battle.time<=0){battle.time=0;finishByTime()}movePlayer(dt);battle.enemies.forEach(e=>{if(!e.alive)return;let dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1;if(d>80){e.x+=dx/d*48*dt;e.y+=dy/d*48*dt}else{e.cd-=dt;if(e.cd<=0){player.hp-=130; e.cd=1.2;if(player.hp<=0){player.hp=0;player.alive=false;endBattle(false)}}}})}drawArena(ctx);$('#timer').textContent=`${String(Math.floor(battle.time/60)).padStart(2,'0')}:${String(Math.floor(battle.time%60)).padStart(2,'0')}`;$('#hudhp').textContent=`${Math.ceil(player.hp).toLocaleString('fr-FR')} / ${player.max.toLocaleString('fr-FR')} PV`;$('#hudbar').style.width=(100*player.hp/player.max)+'%';$('#hudobjective').textContent=battle.mode==='core'?'Noyaux':'Survie';$('#hudinfo').textContent=battle.mode==='core'?(battle.carried?'Noyau volé !':'Noyau de '+S.house+' protégé'):`${battle.enemies.filter(e=>e.alive).length} adversaires`;raf=requestAnimationFrame(draw)};raf=requestAnimationFrame(draw);
cv.onpointerdown=e=>{let r=cv.getBoundingClientRect();attack(e.clientX-r.left,r.width,e.clientY-r.top,r.height)};
}
function drawArena(ctx){let W=960,H=540;ctx.clearRect(0,0,W,H);ctx.fillStyle='#0c1b21';ctx.fillRect(0,0,W,H);for(let y=0;y<H;y+=32)for(let x=0;x<W;x+=32){ctx.fillStyle=((x+y)/32)%2?'#10252a':'#112a2d';ctx.fillRect(x,y,30,30)}ctx.strokeStyle='#24484b';ctx.lineWidth=2;for(let i=0;i<18;i++){ctx.beginPath();ctx.moveTo(i*58,0);ctx.lineTo(i*58,H);ctx.stroke()}for(let i=0;i<10;i++){ctx.beginPath();ctx.moveTo(0,i*58);ctx.lineTo(W,i*58);ctx.stroke()}
if(battle.mode==='core'){let bases=[{x:100,y:100,h:'Eau'},{x:860,y:100,h:'Feu'},{x:480,y:460,h:'Terre'}];bases.forEach(b=>{ctx.fillStyle=elements[b.h].color+'33';ctx.strokeStyle=elements[b.h].color;ctx.lineWidth=3;ctx.beginPath();ctx.arc(b.x,b.y,50,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle=elements[b.h].color;ctx.font='bold 16px sans-serif';ctx.textAlign='center';ctx.fillText('BASE '+b.h,b.x,b.y-58);if(battle.cores[b.h]){ctx.font='28px sans-serif';ctx.fillText('💠',b.x,b.y+10)}})}
let p=battle.player; battle.enemies.forEach(e=>{if(!e.alive)return;ctx.fillStyle=elements[e.team].color;ctx.beginPath();ctx.arc(e.x,e.y,15,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#ffffffaa';ctx.stroke();ctx.fillStyle='#200e18';ctx.fillRect(e.x-18,e.y-27,36,5);ctx.fillStyle='#ff6b67';ctx.fillRect(e.x-18,e.y-27,36*Math.max(0,e.hp/e.max),5)});ctx.fillStyle=elements[p.team].color;ctx.beginPath();ctx.arc(p.x,p.y,19,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();ctx.font='24px sans-serif';ctx.textAlign='center';ctx.fillText(icon(S.selected),p.x,p.y+8);ctx.fillStyle='#fff';ctx.font='bold 12px sans-serif';ctx.fillText('TOI',p.x,p.y-28);if(battle.paused){ctx.fillStyle='#0009';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='bold 40px sans-serif';ctx.fillText('PAUSE',W/2,H/2)}}
function movePlayer(dt){let p=battle.player;let speed=p.speed*(keys.Shift?1.5:1);if(keys.w||keys.ArrowUp)p.y-=speed*dt;if(keys.s||keys.ArrowDown)p.y+=speed*dt;if(keys.a||keys.ArrowLeft)p.x-=speed*dt;if(keys.d||keys.ArrowRight)p.x+=speed*dt;p.x=Math.max(25,Math.min(935,p.x));p.y=Math.max(40,Math.min(515,p.y))}
document.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys[e.key===' '?'Space':e.key]=true;if(e.key===' '||e.key==='Space')attack();if(e.key.toLowerCase()==='q')useSpirit()});document.addEventListener('keyup',e=>{keys[e.key===' '?'Space':e.key]=false});
let attackCD=0;
function attack(x,y,w,h){if(!battle||battle.paused||battle.over)return;let p=battle.player,damage=stats(S.selected).dmg;let alive=battle.enemies.filter(e=>e.alive);if(!alive.length){if(battle.mode==='core'){battle.carried=S.house;toast('Noyau récupéré ! Retourne à ta base.')}return}alive.sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y));let target=alive[0],d=Math.hypot(target.x-p.x,target.y-p.y);if(d<125){target.hp-=damage;if(target.hp<=0){target.alive=false;battle.kills++;battle.log.unshift(`${target.team} éliminé ! +${damage} dégâts.`);if(battle.mode==='core'&&Math.random()<.45){battle.carried=S.house;battle.cores[target.team]=false}}else battle.log.unshift(`${S.selected} frappe ${target.team} : ${damage} dégâts.`)}else battle.log.unshift('Rapproche-toi d’un adversaire pour attaquer.');let log=$('#battlelog');if(log)log.innerHTML=battle.log.slice(0,5).map(s=>`<div>› ${s}</div>`).join('')}
function useSpirit(){if(!battle||battle.over){toast('Lance une partie avant d’utiliser un esprit.');return}let p=battle.player,sp=spirits.find(s=>S.equipped.includes(s.name));if(!sp){p.hp=Math.min(p.max,p.hp+p.max*.18);battle.log.unshift('Aucun esprit équipé : petite récupération de 18% PV.');toast('Pas d’esprit équipé — récupération de secours.')}else{let e=battle.enemies.filter(e=>e.alive);if(sp.effect==='phoenix'||sp.effect==='health'||sp.effect==='heal')p.hp=Math.min(p.max*1.5,p.hp+p.max*.5);else if(sp.effect==='rage'){p.hp*=.7;S.tempDmg=1.5;setTimeout(()=>S.tempDmg=1,8000)}else if(sp.effect==='speed'){p.speed=285;setTimeout(()=>p.speed=190,6000)}else if(sp.effect==='blast'||sp.effect==='heat'||sp.effect==='wave'||sp.effect==='kraken'){e.slice(0,3).forEach(z=>{z.hp-=sp.effect==='blast'?500:z.max*.15;if(z.hp<=0)z.alive=false})}else if(sp.effect==='shell'||sp.effect==='shield'||sp.effect==='stone')p.hp=Math.min(p.max,p.hp+p.max*.2);else if(sp.effect==='team')e.slice(0,3).forEach(z=>z.hp-=z.max*.25);else e.slice(0,2).forEach(z=>z.hp-=z.max*.2);battle.log.unshift(`Esprit ${sp.name} activé !`);toast(`✨ ${sp.name} activé !`)}let log=$('#battlelog');if(log)log.innerHTML=battle.log.slice(0,5).map(s=>`<div>› ${s}</div>`).join('')}
function togglePause(){if(battle)battle.paused=!battle.paused;let b=$('#pausebtn');if(b)b.textContent=battle.paused?'▶ Reprendre':'Ⅱ Pause'}
function finishByTime(){if(!battle)return;if(battle.mode==='core'&&battle.carried){endBattle(true)}else endBattle(battle.player.hp>battle.player.max*.45)}
function endBattle(won){if(!battle||battle.over)return;battle.over=true;cancelAnimationFrame(raf);let mode=battle.mode;S.games++;if(won){S.wins++;S.streak++;S.gold+=100;S.xp+=75;S.trophies+=mode==='duo'?12:mode==='captain'?15:12;S.housePoints[S.house]+=mode==='captain'?10:mode==='core'?15:0;S.elementTokens[S.house]=(S.elementTokens[S.house]||0)+1;if(S.games%15===0)S.tokens++;if(S.streak>=2&&mode==='core'){S.trophies+=S.streak>=5?7:3;S.housePoints[S.house]+=S.streak>=5?15:3}toast('Victoire ! Récompenses gagnées.')}else{S.streak=0;S.xp+=15;S.trophies=Math.max(0,S.trophies-(mode==='duo'?3:2));toast('Défaite… +15 XP pour le pass.')}while(S.xp>=1800&&S.passLevel<50){S.xp-=1800;S.passLevel++;if(S.passLevel%10===0)S.gold+=150}save();let result=`<div class="eyebrow">${won?'Victoire':'Défaite'}</div><h2>${won?'Bien joué, combattant !':'La bataille est terminée'}</h2><p>${mode==='core'?'Mode Vole le noyau':mode==='captain'?'Mode Protège ton capitaine':'Mode Survivant duo'} • ${battle.kills} élimination(s)</p><div class="grid two"><div class="card"><div class="muted">XP de pass</div><h2>+${won?75:15}</h2></div><div class="card"><div class="muted">Trophées</div><h2>${won?'+':'−'}${mode==='duo'?(won?12:3):(won?(mode==='captain'?15:12):2)}</h2></div></div><p>Pièces gagnées : ${won?100:0} 🪙<br>Points de maison : ${won?(mode==='captain'?10:mode==='core'?15:0):0} 🏠</p><button class="primary" onclick="battle=null;go('battle')">Retour au champ de bataille</button> <button onclick="battle=null;go('home')">Accueil</button>`;showModal(result)}
function chooseHouse(h){if(S.house&&S.house!==h){showModal(`<h2>Changer de maison ?</h2><p>Tu es actuellement dans la maison ${S.house}. Changer de maison remettra tes points de saison personnels à zéro ? Non, les points de saison restent au classement mais tu changes d’allégeance.</p><button onclick="S.house='${h}';save();closeModal();render();toast('Maison ${h} choisie !')">Confirmer ${h}</button> <button onclick="closeModal()">Annuler</button>`);return}S.house=h;save();toast('Bienvenue dans la maison '+h+' !');render()}
function renderSpirits(){let own=S.ownedSpirits;$('#main').innerHTML=`<section class="panel"><div class="sectionhead"><div><div class="eyebrow">Pouvoirs passifs et actifs</div><h2>Esprits</h2></div><span class="badge">${own.length} possédé(s)</span></div><p class="muted">Équipe jusqu’à 4 esprits par partie : maximum 1 légendaire et 1 mythique. Les esprits s’obtiennent avec des essences, dans les coffres ou dans le pass.</p><div class="card"><h3>Équipement de combat (${S.equipped.length}/4)</h3><div class="stats">${S.equipped.length?S.equipped.map(n=>'👻 '+n).join(' • '):'Aucun esprit équipé'}</div><button class="small" onclick="S.equipped=[];save();render()">Tout déséquiper</button></div><div class="grid" style="margin-top:12px">${spirits.map(s=>{let owned=own.includes(s.name),eq=S.equipped.includes(s.name);return `<div class="card"><div class="split"><span class="element ${elements[s.element].class}">${elements[s.element].emoji} ${s.element}</span><span class="rarity ${s.rarity.toLowerCase()}">${s.rarity}</span></div><h3>👻 ${s.name}</h3><p class="muted" style="font-size:12px">${s.desc}</p>${owned?`<button class="small ${eq?'active':''}" onclick="equipSpirit('${s.name}')">${eq?'Équipé ✓':'Équiper'}</button>`:`<button class="small" onclick="buySpirit('${s.name}')">Acheter • 100 ✨</button>`}</div>`}).join('')}</div></section>`}
function buySpirit(n){if(S.ownedSpirits.includes(n)){toast('Tu possèdes déjà cet esprit.');return}if(S.essence<100){toast('Il faut 100 essences. Ouvre un coffre ou visite la boutique.');return}S.essence-=100;S.ownedSpirits.push(n);save();render();toast('Esprit '+n+' débloqué !')}
function equipSpirit(n){let s=spirits.find(x=>x.name===n);if(S.equipped.includes(n)){S.equipped=S.equipped.filter(x=>x!==n)}else{if(S.equipped.length>=4){toast('Maximum 4 esprits par partie.');return}if(s.rarity==='Légendaire'&&S.equipped.some(n=>spirits.find(x=>x.name===n)?.rarity==='Légendaire')){toast('Un seul esprit légendaire par partie.');return}if(s.rarity==='Mythique'&&S.equipped.some(n=>spirits.find(x=>x.name===n)?.rarity==='Mythique')){toast('Un seul esprit mythique par partie.');return}S.equipped.push(n)}save();render()}
function renderShop(){$('#main').innerHTML=`<section class="panel"><div class="eyebrow">Marchand élémentaire</div><h2>Boutique</h2><p class="muted">Les prix réels n’étaient pas fixés dans le document. Les achats en argent réel sont désactivés dans cette démo : aucun paiement n’est possible.</p><div class="grid two"><div class="card shopitem"><div class="char-icon">🪙</div><div class="grow"><h3>Pièces d’or</h3><p class="muted">Monnaie d'amélioration et de déblocage.</p><b>150 pièces</b></div><button onclick="buyGold()">Obtenir</button></div><div class="card shopitem"><div class="char-icon">✨</div><div class="grow"><h3>Essences</h3><p class="muted">Pour acheter les esprits. Très rares dans les coffres.</p><b>25 essences</b></div><button onclick="buyEssence()">Obtenir</button></div><div class="card shopitem"><div class="char-icon">🎁</div><div class="grow"><h3>Coffre de ta maison</h3><p class="muted">6 types de récompenses possibles, avec des taux différents.</p><b>Gratuit • démo</b></div><button class="primary" onclick="openChest()">Ouvrir</button></div><div class="card shopitem"><div class="char-icon">🎟️</div><div class="grow"><h3>Jeton d’amélioration</h3><p class="muted">Améliore les combattants du niveau 1 à 5.</p><b>1 jeton</b></div><button onclick="S.gold>=200?(S.gold-=200,S.tokens++,save(),render(),toast('Jeton obtenu !')):toast('Il faut 200 pièces d’or.')">200 🪙</button></div></div></section><section class="panel"><h3>Règles de monnaie</h3><ul class="muted"><li>1 jeton gratuit toutes les 15 parties (règle principale du document).</li><li>Les jetons élémentaires mentionnés ailleurs se débloquent après 50 parties avec un personnage de l’élément correspondant ; les règles du PDF se contredisent pour le feu, donc ils sont affichés comme progression de collection.</li><li>Les essences peuvent venir des coffres et servent à acheter les esprits.</li></ul></section>`}
function buyGold(){toast('Démo : gagne des pièces en jouant !')}
function buyEssence(){toast('Les achats en argent réel sont désactivés. Ouvre les coffres pour obtenir des essences.')}
function renderChests(){$('#main').innerHTML=`<section class="panel"><div class="eyebrow">Récompenses aléatoires</div><h2>Coffres des maisons</h2><p class="muted">Choisis le coffre de ta maison. Les récompenses suivent les probabilités listées dans ton document. Les taux non spécifiés sont conservés comme catégorie rare.</p><div class="grid">${['Feu','Eau','Terre'].map(h=>`<div class="card"><div class="char-icon" style="background:radial-gradient(circle,${elements[h].color}44,transparent),#0a1221;font-size:52px">${h==='Feu'?'🟥':h==='Eau'?'🟦':'🟩'}🎁</div><h3>Coffre ${h}</h3><div class="element ${elements[h].class}">${elements[h].emoji} Maison ${h}</div><p class="muted">Jetons, pièces d’or, essences, personnage, esprit ou bonus étoiles ×2.</p><button class="primary" onclick="openChest('${h}')">Ouvrir le coffre</button></div>`).join('')}</div></section><section class="panel"><h3>Probabilités du document</h3><div class="grid two">${[['50 essences','5%'],['100 essences','2%'],['Personnage','6%'],['50 pièces d’or','15%'],['100 pièces d’or','10%'],['200 pièces d’or','5%'],['800 pièces d’or','1,5%'],['1 jeton','12%'],['3 jetons','6%'],['6 jetons','2%'],['10 jetons','1,3%'],['Esprit','3%'],['Bonus étoiles ×2 — 10 min','31,2%']].map(([a,b])=>`<div class="card split"><span>${a}</span><b>${b}</b></div>`).join('')}</div><p class="muted">Les probabilités indiquées ne totalisent pas 100 % dans le document ; le prototype normalise le tirage parmi les récompenses définies et peut donc différer légèrement.</p></section>`}
function openChest(h=S.house||'Feu'){let r=Math.random()*100,award='';if(r<5){S.essence+=50;award='+50 essences'}else if(r<7){S.essence+=100;award='+100 essences'}else if(r<13){let locked=chars.filter(c=>!S.unlocked.includes(c.name));if(locked.length){let c=locked[Math.floor(Math.random()*locked.length)];S.unlocked.push(c.name);award='Personnage débloqué : '+c.name}else{S.gold+=500;award='Collection complète : +500 pièces'}}else if(r<28){S.gold+=50;award='+50 pièces d’or'}else if(r<38){S.gold+=100;award='+100 pièces d’or'}else if(r<43){S.gold+=200;award='+200 pièces d’or'}else if(r<44.5){S.gold+=800;award='+800 pièces d’or'}else if(r<56.5){S.tokens++;award='+1 jeton'}else if(r<62.5){S.tokens+=3;award='+3 jetons'}else if(r<64.5){S.tokens+=6;award='+6 jetons'}else if(r<65.8){S.tokens+=10;award='+10 jetons'}else if(r<68.8){let available=spirits.filter(s=>!S.ownedSpirits.includes(s.name));if(available.length){let s=available[Math.floor(Math.random()*available.length)];S.ownedSpirits.push(s.name);award='Esprit obtenu : '+s.name}else{S.essence+=50;award='+50 essences'}}else if(r<100){award='Bonus étoiles ×2 activé pour 10 minutes !';S.doubleUntil=Date.now()+600000}S.chestCount++;save();render();showModal(`<div class="eyebrow">Coffre ${h}</div><h2>🎉 ${award}</h2><p>Le coffre s’est ouvert. Tes récompenses ont été ajoutées à ton compte local.</p><button class="primary" onclick="closeModal()">Super !</button>`)}
function renderPass(){$('#main').innerHTML=`<section class="panel hero"><div><div class="eyebrow">50 niveaux • Saison actuelle</div><h2>Pass de combat</h2><p>Chaque niveau demande 1 800 XP. Une victoire rapporte 75 XP, une défaite 15 XP. Les missions donnent au minimum 900 XP selon la difficulté.</p><div class="split"><b>Niveau ${S.passLevel}/50</b><span>${S.xp}/1800 XP</span></div><div class="progress" style="margin:10px 0 16px"><span style="width:${S.xp/18}%"></span></div><button onclick="go('missions')">Voir les missions</button></div><div class="hero-art"><div class="orb"><span>🌟</span></div></div></section><section class="panel"><div class="sectionhead"><h2>Récompenses de progression</h2><span class="muted">50 paliers</span></div><div class="grid">${Array.from({length:50},(_,i)=>`<div class="card"><div class="split"><span class="badge">NIVEAU ${i+1}</span><span>${i+1<=S.passLevel?'✅':'🔒'}</span></div><h3>${i+1===50?'Récompense finale':i+1%10===0?'Coffre de saison':i+1%5===0?'Jetons bonus':'Récompense mystère'}</h3><p class="muted" style="font-size:12px">${i+1<=S.passLevel?'Palier atteint':'1 800 XP par niveau'}</p>${i+1===50?'<span class="rarity legendary">Esprit possible</span>':''}</div>`).join('')}</div><p class="muted">Le document ne fixe pas encore la liste finale des récompenses du pass. Les libellés sont donc provisoires.</p></section>`}
function renderHouse(){$('#main').innerHTML=`<section class="panel"><div class="eyebrow">Factions • Classement de saison</div><h2>Maisons élémentaires</h2><p class="muted">Les victoires font gagner des points à la maison. À la fin de la saison, la maison qui possède le plus de points gagne une récompense exclusive, probablement des essences.</p><div class="housebar">${['Feu','Eau','Terre'].map(h=>`<div class="house" style="border-color:${elements[h].color}"><div class="emblem">${elements[h].emoji}</div><h3>${h}</h3><div style="font-size:24px;font-weight:900">${S.housePoints[h]}</div><div class="muted">points</div>${S.house===h?'<span class="badge">Ta maison</span>':`<button class="small" onclick="chooseHouse('${h}')">Rejoindre</button>`}</div>`).join('')}</div><hr style="border-color:#263650;margin:20px 0"><h3>Choisir ta maison</h3><p>La maison Feu privilégie l’agressivité, Eau la polyvalence et Terre la résistance — ambiance visuelle et rôles de ce prototype.</p><div class="grid">${['Feu','Eau','Terre'].map(h=>`<button onclick="chooseHouse('${h}')">${elements[h].emoji} Maison ${h}</button>`).join('')}</div></section><section class="panel"><h3>Récompenses de modes</h3><div class="grid two"><div class="card"><h3>🛡️ Protège ton capitaine</h3><p>Victoire : +10 points maison. Classement de référence du document : top 1 +15 étoiles et 10 points ; top 2 +10 étoiles et 5 points ; top 3 +5 étoiles et 0 point.</p></div><div class="card"><h3>💠 Vole le noyau</h3><p>Victoire : +15 points maison. Classement : top 1 +12 étoiles et 7 points ; top 2 +6 étoiles et 4 points ; top 3 +3 étoiles et 0 point. Série à partir de 2 victoires : bonus de 3 étoiles et 3 points maison ; dès 5 victoires, +7 étoiles et 15 points maison.</p></div><div class="card"><h3>🧭 Survivant duo</h3><p>6 équipes de 2. Récompenses de classement : top 1 +12 étoiles ; top 2 +8 ; top 3 +4 ; top 4 : 0 ; top 5 : −3 ; top 6 : −5.</p></div><div class="card"><h3>🏆 Ligues de trophées</h3><p>Échelons du document : 0–2 500 ; 2 500–6 500 ; 6 500–12 500 ; 12 500–25 000 ; 25 000–35 000 ; 35 000–50 000+ trophées.</p><div class="progress"><span style="width:${Math.min(100,S.trophies/50000*100)}%"></span></div><div class="muted">${S.trophies.toLocaleString('fr-FR')} trophées</div></div></div></section>`}
const missions=[{name:'Joue 1 partie',desc:'Termine une partie, quel que soit le résultat.',xp:900,check:()=>S.games>=1},{name:'Remporte une victoire',desc:'Gagne un combat.',xp:1200,check:()=>S.wins>=1},{name:'Joue 3 parties',desc:'Enchaîne les combats.',xp:900,check:()=>S.games>=3},{name:'Fais 3 éliminations en un match',desc:'Objectif combat (la démo compte les éliminations de la partie).',xp:900,check:()=>battle&&battle.kills>=3},{name:'Ouvre un coffre',desc:'Récupère une récompense de maison.',xp:900,check:()=>S.chestCount>=1},{name:'Équipe un esprit',desc:'Prépare un pouvoir avant la prochaine partie.',xp:900,check:()=>S.equipped.length>0}];
function renderMissions(){$('#main').innerHTML=`<section class="panel"><div class="eyebrow">Défis quotidiens & saisonniers</div><h2>Missions</h2><p class="muted">Chaque mission rapporte au minimum 900 XP selon sa difficulté. 1 800 XP permettent de monter d’un niveau dans le pass.</p><div class="grid two">${missions.map((m,i)=>{let done=S.missionDone.includes(i),ready=m.check();return `<div class="card"><div class="split"><span class="badge">MISSION ${i+1}</span><span>${done?'✅':ready?'🎁':'🔒'}</span></div><h3>${m.name}</h3><p class="muted">${m.desc}</p><div class="split"><b>+${m.xp} XP</b>${done?'<span class="muted">Réclamée</span>':`<button class="small" ${ready?'':'disabled'} onclick="claimMission(${i})">${ready?'Réclamer':'En cours'}</button>`}</div></div>`}).join('')}</div></section>`}
function claimMission(i){let m=missions[i];if(S.missionDone.includes(i)||!m.check())return;S.missionDone.push(i);S.xp+=m.xp;while(S.xp>=1800&&S.passLevel<50){S.xp-=1800;S.passLevel++;if(S.passLevel%10===0)S.gold+=150}save();render();toast('Mission terminée : +'+m.xp+' XP !')}
function showModal(html){$('#modalbox').innerHTML=html;$('#modal').classList.remove('hidden')}function closeModal(){$('#modal').classList.add('hidden')}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
render();
</script></body></html>
