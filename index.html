<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>WAR OF ELEMENT</title>
<style>
:root{color-scheme:dark;--bg:#080c16;--panel:#111827;--panel2:#151f32;--line:#26334a;--muted:#91a0b8;--text:#f4f7ff;--blue:#8ca8ff;--cyan:#68e4ef;--fire:#ff775e;--water:#55b8ff;--earth:#66d69b;--shadow:0 18px 50px #0005}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#1b2b4b 0,transparent 52%),var(--bg);color:var(--text);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}button,input{font:inherit}button{cursor:pointer;color:inherit;border:1px solid var(--line);background:#1a2539;border-radius:13px;padding:12px 15px;font-weight:750;transition:transform .15s,border-color .15s}button:active{transform:scale(.98)}button:disabled{opacity:.5;cursor:not-allowed}.primary{background:linear-gradient(120deg,#738fff,#9d83ff);color:#080d1a;border:0;box-shadow:0 8px 25px #7f8fff28}.ghost{background:transparent}.danger{color:#ffaaa1}.wrap{max-width:1180px;margin:auto;padding:18px 18px 100px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 24px}.brand{display:flex;align-items:center;gap:11px}.logo{display:grid;place-items:center;width:45px;height:45px;border-radius:15px;background:linear-gradient(135deg,#ff795e,#9b7bff 60%,#57c9ff);font-size:23px;box-shadow:0 8px 25px #6d7bff30}.brand h1{font-size:17px;letter-spacing:.13em;margin:0}.brand p{margin:3px 0 0;color:var(--muted);font-size:10px;letter-spacing:.16em}.status{font-size:12px;color:var(--muted);display:flex;gap:7px;align-items:center}.dot{width:8px;height:8px;border-radius:50%;background:#f0bd68}.dot.ok{background:#5ce0a0}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px}.sidebar,.panel{border:1px solid var(--line);background:linear-gradient(160deg,#131d30f5,#0e1524f5);border-radius:22px;box-shadow:var(--shadow)}.sidebar{padding:12px;height:max-content;position:sticky;top:14px}.nav{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:transparent;border:1px solid transparent;color:#aab7ce;margin:3px 0;padding:12px}.nav.active{background:#24314b;border-color:#344665;color:#fff}.nav .ico{width:22px;text-align:center;font-size:17px}.sidebar-note{padding:13px 10px 5px;color:var(--muted);font-size:11px}.main{min-width:0;display:grid;gap:16px;align-content:start}.panel{padding:clamp(16px,3vw,25px)}.hero{position:relative;overflow:hidden;min-height:265px;display:flex;align-items:center}.hero:after{content:"";position:absolute;width:300px;height:300px;border-radius:50%;right:3%;top:-30px;background:radial-gradient(circle,#9a7bff3c,transparent 68%);pointer-events:none}.hero-copy{position:relative;z-index:1;max-width:610px}.eyebrow{font-size:11px;font-weight:850;letter-spacing:.18em;color:var(--cyan);text-transform:uppercase}.hero h2{font-size:clamp(35px,6vw,64px);letter-spacing:-.055em;line-height:.98;margin:14px 0}.gradient{background:linear-gradient(90deg,#ff9b75,#bd9bff,#75dfff);-webkit-background-clip:text;background-clip:text;color:transparent}.hero p{color:#aab7ce;max-width:520px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:22px}.section-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.section-title h2,.section-title h3{margin:0;font-size:18px}.muted{color:var(--muted)}.small{font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.element-card{border:1px solid var(--line);border-radius:18px;padding:17px;background:#10192a;position:relative;overflow:hidden;min-width:0}.element-card.selected{border-color:#a2aaff;box-shadow:inset 0 0 0 1px #a2aaff35}.element-card .emoji{font-size:30px}.element-card h3{margin:12px 0 4px}.element-card p{color:var(--muted);font-size:12px;min-height:34px}.element-card.fire{background:linear-gradient(145deg,#321d28,#121827 70%)}.element-card.water{background:linear-gradient(145deg,#152e45,#121827 70%)}.element-card.earth{background:linear-gradient(145deg,#17352d,#121827 70%)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{padding:14px;border-radius:15px;border:1px solid var(--line);background:#0c1422}.stat b{font-size:21px;display:block}.stat span{font-size:11px;color:var(--muted)}.two-col{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.auth-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px;margin:10px 0}.field label{font-size:12px;color:#bac6da;font-weight:700}.field input{width:100%;padding:13px 14px;border:1px solid #34415b;background:#080e1a;color:#fff;border-radius:12px;outline:none}.field input:focus{border-color:#8ca8ff;box-shadow:0 0 0 3px #8ca8ff1b}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.message{padding:11px 13px;border-radius:12px;background:#172a28;color:#9ef0c3;font-size:13px;margin-top:10px}.message.error{background:#351e28;color:#ffb5bb}.hidden{display:none!important}.profile-line{display:flex;align-items:center;gap:12px}.avatar{width:48px;height:48px;display:grid;place-items:center;background:#242d48;border-radius:15px;font-size:24px}.pill{display:inline-flex;padding:5px 9px;border-radius:99px;border:1px solid var(--line);color:#b8c6dd;font-size:11px}.friend-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #26334a}.friend-item:last-child{border:0}.arena{height:min(55vw,390px);min-height:220px;border-radius:18px;border:1px solid #2b3b59;overflow:hidden;position:relative;background:radial-gradient(ellipse at 50% 40%,#24385c,#0b1220 72%)}.arena:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#52658b1c 1px,transparent 1px),linear-gradient(90deg,#52658b1c 1px,transparent 1px);background-size:28px 28px;transform:perspective(250px) rotateX(18deg) scale(1.2);transform-origin:center}.orb{position:absolute;width:66px;height:66px;border-radius:50%;display:grid;place-items:center;font-size:28px;box-shadow:0 0 40px currentColor;animation:float 3s ease-in-out infinite}.orb.one{color:#ff775e;background:#ff775e22;border:1px solid #ff775e;left:22%;top:26%}.orb.two{color:#55b8ff;background:#55b8ff22;border:1px solid #55b8ff;right:21%;top:48%;animation-delay:.8s}.orb.three{color:#66d69b;background:#66d69b22;border:1px solid #66d69b;left:48%;bottom:12%;animation-delay:1.4s}@keyframes float{50%{transform:translateY(-10px)}}.arena-label{position:absolute;bottom:14px;left:14px;right:14px;display:flex;justify-content:space-between;gap:10px;color:#c5d1e6;font-size:12px}.mobile-nav{display:none}.foot{color:#64748b;text-align:center;font-size:11px;margin:25px 0}.toast{position:fixed;z-index:9;left:50%;bottom:22px;transform:translateX(-50%);background:#eef2ff;color:#101626;padding:12px 17px;border-radius:13px;font-weight:750;box-shadow:var(--shadow);max-width:calc(100% - 24px)}
@media(max-width:820px){.layout{grid-template-columns:1fr}.sidebar{display:none}.mobile-nav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;position:fixed;z-index:5;bottom:0;left:0;right:0;padding:8px max(8px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));background:#090e1bf2;border-top:1px solid #26334a;backdrop-filter:blur(18px)}.mobile-nav button{padding:9px 4px;border-radius:12px;background:transparent;border-color:transparent;color:#aab7ce;font-size:11px}.mobile-nav button.active{background:#24314b;color:#fff}.mobile-nav .ico{display:block;font-size:18px;margin-bottom:3px}.wrap{padding:13px 12px 105px}.top{margin-bottom:14px}.two-col{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.element-card p{min-height:0}.hero{min-height:255px}.stats{gap:6px}.stat{padding:10px}.stat b{font-size:18px}}
@media(min-width:560px) and (max-width:820px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.element-card{padding:13px}.auth-grid{grid-template-columns:1fr 1fr}}
@media(max-width:420px){.brand h1{font-size:14px}.brand p{font-size:9px}.status{font-size:10px}.hero h2{font-size:39px}.auth-grid{grid-template-columns:1fr}.actions button{flex:1}.arena{min-height:230px}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div class="brand"><div class="logo">⚔</div><div><h1>WAR OF ELEMENT</h1><p>CHOISIS TA FORCE. ÉCRIS TA LÉGENDE.</p></div></div><div class="status"><span class="dot" id="connectionDot"></span><span id="connectionText">Mode démo</span></div></header>
<div class="layout">
<aside class="sidebar">
<button class="nav active" data-page="home"><span class="ico">⌂</span>Accueil</button>
<button class="nav" data-page="play"><span class="ico">⚔</span>Arène</button>
<button class="nav" data-page="elements"><span class="ico">✧</span>Éléments</button>
<button class="nav" data-page="friends"><span class="ico">♧</span>Amis</button>
<button class="nav" data-page="account"><span class="ico">◉</span>Compte</button>
<div class="sidebar-note">Version de développement<br>Mobile · Tablette · Ordinateur</div>
</aside>
<main class="main" id="main"></main>
</div>
<nav class="mobile-nav" aria-label="Navigation principale">
<button class="active" data-page="home"><span class="ico">⌂</span>Accueil</button><button data-page="play"><span class="ico">⚔</span>Arène</button><button data-page="friends"><span class="ico">♧</span>Amis</button><button data-page="account"><span class="ico">◉</span>Compte</button>
</nav>
<div class="foot">WAR OF ELEMENT · Prototype en développement · Ne partage jamais tes identifiants.</div>
</div>
<div id="toast" class="toast hidden" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// Configuration Supabase du projet WAR OF ELEMENT.
const SUPABASE_URL = 'https://fetavgzousxmpgejmydo.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_MVSK_j4bXrcpvWaU22op6w_1spsrgyG';
const supabaseReady = !!(window.supabase && SUPABASE_URL.startsWith('https://') && SUPABASE_PUBLISHABLE_KEY.startsWith('sb_publishable_'));
const db = supabaseReady ? window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY) : null;
const $ = s => document.querySelector(s);
let currentUser = null, currentProfile = null, selectedElement = localStorage.getItem('woe-element') || 'Feu', activePage = 'home';
let toastTimer;
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),3400)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const elements={Feu:{emoji:'🔥',desc:'Puissance, courage et dégâts explosifs.',color:'#ff775e',class:'fire'},Eau:{emoji:'💧',desc:'Adaptation, précision et maîtrise.',color:'#55b8ff',class:'water'},Terre:{emoji:'🌿',desc:'Résistance, équilibre et défense.',color:'#66d69b',class:'earth'}};
function setConnection(ok,label){$('#connectionDot').classList.toggle('ok',!!ok);$('#connectionText').textContent=label}
function nav(page){activePage=page;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));render()}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.page)));
function home(){return `<section class="panel hero"><div class="hero-copy"><div class="eyebrow">Saison 01 · L'éveil des éléments</div><h2>Le pouvoir est<br><span class="gradient">entre tes mains.</span></h2><p>Choisis ton élément, construis ton équipe et prépare-toi à entrer dans l'arène. Ta légende commence ici.</p><div class="actions"><button class="primary" onclick="nav('play')">⚔ Entrer dans l'arène</button><button class="ghost" onclick="nav('elements')">Choisir mon élément</button></div></div></section>
<section class="panel"><div class="section-title"><h2>Choisis ta force</h2><span class="pill">Ton élément</span></div>${elementCards()}</section>
<section class="stats"><div class="stat"><b>3</b><span>Éléments disponibles</span></div><div class="stat"><b>${currentUser?'✓':'—'}</b><span>${currentUser?'Compte connecté':'Compte joueur'}</span></div><div class="stat"><b>∞</b><span>Combats à venir</span></div></section>`}
function elementCards(){return `<div class="grid">${Object.entries(elements).map(([name,e])=>`<article class="element-card ${e.class} ${selectedElement===name?'selected':''}"><div class="emoji">${e.emoji}</div><h3>${name}</h3><p>${e.desc}</p><button class="${selectedElement===name?'primary':'ghost'}" onclick="chooseElement('${name}')">${selectedElement===name?'✓ Sélectionné':'Choisir'}</button></article>`).join('')}</div>`}
function elementsPage(){return `<section class="panel"><div class="eyebrow">Ton identité de combat</div><h2>Choisis ton élément.</h2><p class="muted">Tu peux le changer quand tu veux. Ton choix est conservé sur cet appareil.</p>${elementCards()}</section><section class="panel"><h3>Ton élément actuel</h3><div class="profile-line"><div class="avatar">${elements[selectedElement].emoji}</div><div><b>${selectedElement}</b><div class="muted small">${elements[selectedElement].desc}</div></div></div></section>`}
function playPage(){return `<section class="panel"><div class="eyebrow">Zone de combat</div><h2>Bienvenue dans l'arène.</h2><p class="muted">Le terrain est prêt. Le combat en ligne réel sera activé dans une prochaine étape après la mise en place sécurisée des salons et de la synchronisation.</p><div class="arena"><div class="orb one">🔥</div><div class="orb two">💧</div><div class="orb three">🌿</div><div class="arena-label"><span>⚔ Arène élémentaire</span><span class="pill">Aperçu · hors combat</span></div></div><div class="actions"><button class="primary" onclick="toast('Le multijoueur sera activé après la configuration des salons en ligne.')">Trouver une partie</button><button onclick="nav('friends')">Inviter un ami</button></div></section><section class="panel"><div class="section-title"><h3>État du multijoueur</h3><span class="pill">En préparation</span></div><p class="muted small">Les comptes et les amis sont la première étape. Pour des parties équitables, le serveur devra aussi valider les actions et synchroniser l'état du match.</p></section>`}
function accountPage(){return `<section class="panel"><div class="eyebrow">Compte joueur</div><h2>${currentUser?'Ton compte':'Rejoins la bataille.'}</h2><p class="muted">${currentUser?'Ton compte Supabase est connecté.':'Crée un compte pour retrouver ton profil sur tes appareils.'}</p><div id="authMessage" class="hidden"></div>${currentUser?`<div class="profile-line"><div class="avatar">${elements[selectedElement].emoji}</div><div><b>${esc(currentProfile?.username || currentUser.email || 'Joueur')}</b><div class="muted small">${esc(currentUser.email||'')} · connecté</div></div></div><div class="actions"><button onclick="nav('friends')">Mes amis</button><button class="danger" onclick="signOut()">Se déconnecter</button></div>`:`<div class="auth-grid"><div><h3>Créer un compte</h3><form id="signupForm"><div class="field"><label for="signupUsername">Pseudo (3 à 20 caractères)</label><input id="signupUsername" name="username" minlength="3" maxlength="20" pattern="[A-Za-z0-9_]{3,20}" autocomplete="nickname" required placeholder="Ex. ElementFares"></div><div class="field"><label for="signupEmail">E-mail</label><input id="signupEmail" type="email" autocomplete="email" required placeholder="toi@exemple.com"></div><div class="field"><label for="signupPassword">Mot de passe (8 caractères minimum)</label><input id="signupPassword" type="password" minlength="8" autocomplete="new-password" required placeholder="8 caractères minimum"></div><button class="primary" type="submit" style="width:100%">Créer mon compte</button></form></div><div><h3>J'ai déjà un compte</h3><form id="loginForm"><div class="field"><label for="loginEmail">E-mail</label><input id="loginEmail" type="email" autocomplete="email" required placeholder="toi@exemple.com"></div><div class="field"><label for="loginPassword">Mot de passe</label><input id="loginPassword" type="password" autocomplete="current-password" required placeholder="Ton mot de passe"></div><button type="submit" style="width:100%">Se connecter</button><button type="button" class="ghost" style="width:100%;margin-top:8px" onclick="resetPassword()">Mot de passe oublié</button></form></div></div><p class="muted small">En créant un compte, utilise une adresse e-mail à laquelle tu as accès. Si la confirmation par e-mail est activée, vérifie ta boîte de réception.</p>`}</section><section class="panel"><div class="section-title"><h3>Configuration</h3><span class="pill">Supabase</span></div><p class="muted small">${db?'Le client Supabase est chargé.':'Le client Supabase ne s’est pas chargé. Vérifie ta connexion Internet.'} La clé utilisée ici est une clé publique. Ne place jamais de clé secrète dans ce fichier.</p></section>`}
function friendsPage(){return `<section class="panel"><div class="eyebrow">Joue avec tes potes</div><h2>Amis & invitations</h2><p class="muted">Recherche un pseudo exact pour envoyer une demande d'ami.</p>${currentUser?`<form id="friendForm"><div class="field"><label for="friendUsername">Pseudo du joueur</label><input id="friendUsername" required minlength="3" maxlength="20" pattern="[A-Za-z0-9_]{3,20}" placeholder="Pseudo exact"></div><button class="primary" type="submit">Envoyer une demande</button></form><div id="friendMessage" class="hidden"></div><div class="section-title" style="margin-top:22px"><h3>Demandes reçues</h3></div><div id="incoming"><p class="muted small">Chargement…</p></div><div class="section-title" style="margin-top:22px"><h3>Demandes envoyées</h3></div><div id="outgoing"><p class="muted small">Chargement…</p></div>`:`<p>Connecte-toi pour chercher des joueurs et ajouter tes amis.</p><button class="primary" onclick="nav('account')">Se connecter / créer un compte</button>`}</section>`}
function render(){const main=$('#main');if(activePage==='home')main.innerHTML=home();else if(activePage==='elements')main.innerHTML=elementsPage();else if(activePage==='play')main.innerHTML=playPage();else if(activePage==='account'){main.innerHTML=accountPage();wireAuth()}else if(activePage==='friends'){main.innerHTML=friendsPage();wireFriends()} }
function chooseElement(name){selectedElement=name;localStorage.setItem('woe-element',name);render();toast(`${name} est ton élément !`)}
function showFormMessage(id,msg,isError=false){const el=document.getElementById(id);if(!el)return;el.textContent=msg;el.classList.remove('hidden','error');el.classList.add('message');if(isError)el.classList.add('error')}
async function ensureProfile(username){if(!currentUser)return;let {data,error}=await db.from('profiles').select('id,username').eq('id',currentUser.id).maybeSingle();if(data){currentProfile=data;return}username = username || currentUser.user_metadata?.username; if(username){const {data:created,error:insertErr}=await db.from('profiles').insert({id:currentUser.id,username}).select('id,username').single();if(!insertErr){currentProfile=created;return}if(insertErr.code==='23505')throw new Error('Ce pseudo est déjà utilisé. Choisis-en un autre.');throw insertErr}currentProfile=null}
function wireAuth(){if(!db){setConnection(false,'Client indisponible');return}const signup=$('#signupForm');if(signup)signup.addEventListener('submit',async e=>{e.preventDefault();const btn=signup.querySelector('button[type=submit]');btn.disabled=true;try{const username=$('#signupUsername').value.trim();const email=$('#signupEmail').value.trim();const password=$('#signupPassword').value;if(!/^[A-Za-z0-9_]{3,20}$/.test(username))throw new Error('Le pseudo doit contenir 3 à 20 lettres, chiffres ou tirets bas.');const {data,error}=await db.auth.signUp({email,password,options:{data:{username}}});if(error)throw error;if(data.user&&data.session){currentUser=data.user;await ensureProfile(username);setConnection(true,'Connecté');render();toast('Compte créé, bienvenue !')}else{showFormMessage('authMessage','Compte créé ! Vérifie tes e-mails pour confirmer ton inscription, puis connecte-toi.');$('#authMessage').classList.remove('hidden')}}catch(err){showFormMessage('authMessage',err.message||'Impossible de créer le compte.',true);$('#authMessage').classList.remove('hidden')}finally{const b=signup.querySelector('button[type=submit]');if(b)b.disabled=false}});
const login=$('#loginForm');if(login)login.addEventListener('submit',async e=>{e.preventDefault();const b=login.querySelector('button[type=submit]');b.disabled=true;try{const {data,error}=await db.auth.signInWithPassword({email:$('#loginEmail').value.trim(),password:$('#loginPassword').value});if(error)throw error;currentUser=data.user;await ensureProfile();setConnection(true,'Connecté');render();toast('Connexion réussie !')}catch(err){showFormMessage('authMessage',err.message||'Connexion impossible.',true);$('#authMessage').classList.remove('hidden')}finally{if(b)b.disabled=false}})}
async function resetPassword(){const email=$('#loginEmail')?.value.trim();if(!email){toast('Saisis ton e-mail dans le champ de connexion.');return}const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:location.href.split('#')[0]});toast(error?error.message:'Si un compte existe pour cette adresse, un e-mail de réinitialisation va être envoyé.')}
async function signOut(){if(db)await db.auth.signOut();currentUser=null;currentProfile=null;setConnection(true,'Non connecté');nav('home');toast('Tu es déconnecté.')}
function wireFriends(){if(!currentUser||!db)return;loadRequests();const form=$('#friendForm');form?.addEventListener('submit',async e=>{e.preventDefault();const b=form.querySelector('button');b.disabled=true;try{if(!currentProfile)throw new Error('Ton profil n’est pas encore créé. Déconnecte-toi puis reconnecte-toi.');const username=$('#friendUsername').value.trim();const {data:target,error:findErr}=await db.from('profiles').select('id,username').eq('username',username).maybeSingle();if(findErr)throw findErr;if(!target)throw new Error('Pseudo introuvable. Vérifie l’orthographe.');if(target.id===currentUser.id)throw new Error('Tu ne peux pas t’ajouter toi-même.');const {error}=await db.from('friend_requests').insert({sender_id:currentUser.id,receiver_id:target.id});if(error){if(error.code==='23505')throw new Error('Une demande existe déjà entre ces comptes.');throw error}showFormMessage('friendMessage','Demande envoyée !');$('#friendUsername').value='';await loadRequests()}catch(err){showFormMessage('friendMessage',err.message||'La demande n’a pas pu être envoyée.',true)}finally{b.disabled=false}})}
async function loadRequests(){const incoming=$('#incoming'),outgoing=$('#outgoing');if(!incoming||!outgoing)return;incoming.innerHTML='<p class="muted small">Chargement…</p>';outgoing.innerHTML='<p class="muted small">Chargement…</p>';try{const {data:requests,error}=await db.from('friend_requests').select('id,sender_id,receiver_id,status,created_at').or(`sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`).order('created_at',{ascending:false});if(error)throw error;const ids=[...new Set((requests||[]).map(r=>r.sender_id===currentUser.id?r.receiver_id:r.sender_id))];let names={};if(ids.length){const {data:profiles,error:pe}=await db.from('profiles').select('id,username').in('id',ids);if(pe)throw pe;(profiles||[]).forEach(p=>names[p.id]=p.username)}const received=(requests||[]).filter(r=>r.receiver_id===currentUser.id);const sent=(requests||[]).filter(r=>r.sender_id===currentUser.id);incoming.innerHTML=received.length?received.map(r=>`<div class="friend-item"><div><b>${esc(names[r.sender_id]||'Joueur')}</b><div class="muted small">Demande reçue · ${esc(r.status)}</div></div><span class="pill">${esc(r.status)}</span></div>`).join(''):'<p class="muted small">Aucune demande reçue.</p>';outgoing.innerHTML=sent.length?sent.map(r=>`<div class="friend-item"><div><b>${esc(names[r.receiver_id]||'Joueur')}</b><div class="muted small">Demande envoyée</div></div><span class="pill">${esc(r.status)}</span></div>`).join(''):'<p class="muted small">Aucune demande envoyée.</p>'}catch(err){incoming.innerHTML='<p class="muted small">Impossible de charger les demandes.</p>';outgoing.innerHTML=`<p class="message error">${esc(err.message||'Erreur de chargement')}</p>`}}
async function boot(){if(!db){setConnection(false,'Mode démo');render();return}try{const {data:{session},error}=await db.auth.getSession();if(error)throw error;currentUser=session?.user||null;if(currentUser){try{await ensureProfile()}catch(e){console.warn(e)}}setConnection(true,currentUser?'Connecté':'Supabase prêt');db.auth.onAuthStateChange((_event,session)=>{currentUser=session?.user||null;setConnection(true,currentUser?'Connecté':'Supabase prêt');if(activePage==='account'||activePage==='friends')render()});}catch(e){setConnection(false,'Connexion à vérifier');console.error(e)}render()}
boot();
</script>
</body>
</html>
